<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Scribe de Poudlard - OCR & Grimoires</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Fauna+One&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Fauna One', serif; background-color: #0f172a; color: #e2e8f0; }
    h1, h2, h3, .magic-font { font-family: 'Cinzel', serif; }
    .gold-border { border-color: #d97706; }
    .gold-text { color: #f59e0b; }
  </style>
</head>
<body class="min-h-screen p-6">

  <header class="text-center my-6">
    <h1 class="text-4xl font-bold gold-text tracking-widest uppercase">✨ Le Scribe de Poudlard ✨</h1>
    <p class="text-slate-400 italic mt-2">Transcrivez vos parchemins et organisez vos grimoires magiques</p>
  </header>

  <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
    
    <section class="bg-slate-900 p-4 rounded-xl border border-amber-600/30 shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold gold-text">📜 Grimoires</h2>
        <button onclick="createNewBinder()" class="bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded text-sm transition">+ Nouveau</button>
      </div>
      <ul id="binder-list" class="space-y-2">
        </ul>
    </section>

    <section class="lg:col-span-3 space-y-6">
      
      <div class="bg-slate-900 p-6 rounded-xl border border-amber-600/30 text-center">
        <label for="image-input" class="cursor-pointer block border-2 border-dashed border-amber-600/50 hover:border-amber-500 p-8 rounded-lg transition">
          <span class="text-4xl block mb-2">📸</span>
          <span class="gold-text font-bold">Déposez un parchemin ou une double page</span>
          <p class="text-xs text-slate-400 mt-1">Formats acceptés : PNG, JPG, WEBP</p>
        </label>
        <input type="file" id="image-input" accept="image/*" class="hidden" onchange="processImage(event)">
        <div id="loading-spinner" class="hidden mt-4 gold-text font-bold animate-pulse">
          🪄 Enchantement en cours... Analyse du texte et extraction des images...
        </div>
      </div>

      <div id="output-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
        <div class="bg-amber-50/5 text-slate-200 p-6 rounded-xl border gold-border shadow-inner">
          <span class="text-xs gold-text font-bold uppercase tracking-wider block mb-2">Page Left / Single</span>
          <div id="page-left-content" class="space-y-4"></div>
        </div>

        <div id="page-right-wrapper" class="bg-amber-50/5 text-slate-200 p-6 rounded-xl border gold-border shadow-inner hidden">
          <span class="text-xs gold-text font-bold uppercase tracking-wider block mb-2">Page Right</span>
          <div id="page-right-content" class="space-y-4"></div>
        </div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
